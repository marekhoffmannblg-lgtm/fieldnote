project_id = "fieldnote-stroller-mvp"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[auth]
enable_signup = false
enable_anonymous_sign_ins = false
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "http://localhost:5173/**", "http://127.0.0.1:5173/**"]

[storage]
file_size_limit = "25MiB"
