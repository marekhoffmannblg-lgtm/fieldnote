name: Offline quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-gate:
    name: Offline test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r fieldnote-api/requirements.txt
      - name: Install frontend dependencies
        working-directory: fieldnote-frontend
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run offline quality gate
        run: bash scripts/check_fieldnote.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Audit Python dependencies
        run: python -m pip install --upgrade pip pip-audit && pip-audit -r requirements.txt
      - name: Audit production frontend dependencies
        working-directory: fieldnote-frontend
        run: corepack enable && pnpm install --frozen-lockfile && pnpm audit --prod --audit-level high
